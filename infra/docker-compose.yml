# Local development stack. Usage (from repo root):
#   docker compose -f infra/docker-compose.yml up -d db
#   docker compose -f infra/docker-compose.yml run --rm api alembic upgrade head
#   docker compose -f infra/docker-compose.yml up api
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp_dev_pw
      POSTGRES_DB: erp_dev
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_dev"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    build: ../backend
    environment:
      ERP_DATABASE_URL: postgresql+psycopg://erp:erp_dev_pw@db:5432/erp_dev
      ERP_ENV: dev
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
