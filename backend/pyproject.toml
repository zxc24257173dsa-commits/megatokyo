[project]
name = "whatnot-erp"
version = "0.1.0"
description = "Whatnot Global ERP V2 - cross-border live-commerce ERP"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.*",
    "uvicorn[standard]==0.32.*",
    "sqlalchemy==2.0.*",
    "psycopg[binary]==3.2.*",
    "alembic==1.14.*",
    "pydantic-settings==2.6.*",
    "argon2-cffi==23.1.*",
    "pyjwt==2.10.*",
    "pyotp==2.9.*",
    "cryptography==44.*",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.*",
    "httpx==0.28.*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
